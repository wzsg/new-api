name: myclaude-local
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: myclaude
      POSTGRES_PASSWORD: myclaude-local
      POSTGRES_DB: myclaude
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "myclaude", "-d", "myclaude"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      SQL_DSN: postgres://myclaude:myclaude-local@postgres:5432/myclaude?sslmode=disable
      REDIS_CONN_STRING: redis://redis:6379
      TZ: Asia/Singapore
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-data:/data

volumes:
  postgres-data:
  app-data:
