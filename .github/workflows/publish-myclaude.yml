name: Publish MyClaude image

on:
  push:
    branches: [myclaude]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'wzsg/new-api'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_VERSION: v1.0.0-rc.49
      IMAGE: ghcr.io/wzsg/new-api-myclaude
    steps:
      - name: Check out the MyClaude commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build and publish Linux amd64 image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$UPSTREAM_VERSION-myclaude.$GITHUB_RUN_NUMBER"
          printf '%s\n' "$version" > VERSION
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$IMAGE:$version" .
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$IMAGE:$version"
          printf 'Published `%s:%s`\n' "$IMAGE" "$version" >> "$GITHUB_STEP_SUMMARY"
